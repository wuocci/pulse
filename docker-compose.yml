# Local development. Production deployment is issue #11.
services:
  db:
    # TimescaleDB HA image ships PostGIS as well.
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pulse"]
      interval: 5s
      retries: 10

  api:
    image: node:24-slim
    working_dir: /repo
    # pnpm 12 switches itself to the exact version in package.json "packageManager".
    command: sh -c "npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @pulse/api dev"
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
      # Keep the container's Linux node_modules separate from the host's.
      - api-node-modules:/repo/node_modules
      - api-app-node-modules:/repo/apps/api/node_modules
      - api-schema-node-modules:/repo/packages/schema/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-slim
    working_dir: /repo
    # Installs only the web app and its workspace dependencies; --host makes Vite reachable from outside the container.
    command: sh -c "npm install -g pnpm@12 && pnpm install --frozen-lockfile --filter @pulse/web... && pnpm --filter @pulse/web dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      # Its own Linux node_modules: separate from the host's and from the api service's.
      - web-node-modules:/repo/node_modules
      - web-app-node-modules:/repo/apps/web/node_modules
      - web-client-node-modules:/repo/packages/client/node_modules
      - web-schema-node-modules:/repo/packages/schema/node_modules

volumes:
  db-data:
  api-node-modules:
  api-app-node-modules:
  api-schema-node-modules:
  web-node-modules:
  web-app-node-modules:
  web-client-node-modules:
  web-schema-node-modules:
